# Railway Build Configuration
[build.setup]
# Set the working directory to backend for Django apps
workDir = "backend"

[build.nixpacks]
# No additional config needed, Railway will detect Django/Python

[start]
# Run from backend directory where manage.py and config are located
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 3 --log-file -"
